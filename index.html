<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa & Usia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6f3b0 0%, #f6f3b0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #3a7fed;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #deed97;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin: 30px 0;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-tampilkan {
            background-color: #375eea;
            color: white;
        }

        .btn-tampilkan:hover {
            background-color: #326aee;
        }

        .btn-reset {
            background-color: #d1d5db;
            color: #374151;
        }

        .btn-reset:hover {
            background-color: #9ca3af;
        }

        .hasil {
            background-color: #7db1f6;
            border: 2px solid #6389ba;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .hasil.show {
            display: block;
        }

        .hasil p {
            color: #1174f5;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .hasil span {
            color: #1174f5;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Data Mahasiswa & Usia</h1>

        <div class="form-group">
            <input 
                type="text" 
                id="nama" 
                placeholder="Nama"
            >
        </div>

        <div class="form-group">
            <input 
                type="text" 
                id="nim" 
                placeholder="NIM"
            >
        </div>

        <div class="form-group">
            <input 
                type="number" 
                id="tahunLahir" 
                placeholder="Tahun lahir"
            >
        </div>

        <div class="button-group">
            <button class="btn-tampilkan" onclick="tampilkanData()">Tampilkan</button>
            <button class="btn-reset" onclick="resetForm()">Reset</button>
        </div>

        <div class="hasil" id="hasil">
            <p>Nama : <span id="hasilNama"></span></p>
            <p>NIM : <span id="hasilNim"></span></p>
            <p>Usia : <span id="hasilUsia"></span> tahun</p>
        </div>
    </div>

    <script>
        function tampilkanData() {
            const nama = document.getElementById('nama').value;
            const nim = document.getElementById('nim').value;
            const tahunLahir = parseInt(document.getElementById('tahunLahir').value);

            // Validasi
            if (!nama || !nim || !tahunLahir) {
                alert('Semua field harus diisi!');
                return;
            }

            const tahunSekarang = new Date().getFullYear();

            if (tahunLahir <= 0 || tahunLahir > tahunSekarang) {
                alert('Tahun lahir tidak valid!');
                return;
            }

            // Hitung usia
            const usia = tahunSekarang - tahunLahir;

            // Tampilkan hasil
            document.getElementById('hasilNama').textContent = nama;
            document.getElementById('hasilNim').textContent = nim;
            document.getElementById('hasilUsia').textContent = usia;
            document.getElementById('hasil').classList.add('show');
        }

        function resetForm() {
            document.getElementById('nama').value = '';
            document.getElementById('nim').value = '';
            document.getElementById('tahunLahir').value = '';
            document.getElementById('hasil').classList.remove('show');
        }

        // Tombol Enter untuk submit
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                tampilkanData();
            }
        });
    </script>
</body>

</html>
